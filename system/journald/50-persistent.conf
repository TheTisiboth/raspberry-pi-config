# Installed as /etc/systemd/journald.conf.d/50-persistent.conf. Overrides
# Raspberry Pi OS's 40-rpi-volatile-storage.conf, which keeps the journal in
# RAM only, so every crash wiped the logs that would explain it.
[Journal]
Storage=persistent
# Cap SD card usage and wear
SystemMaxUse=200M
# Default is 5 min: a hang that ends in a watchdog reset would lose exactly
# the minutes that matter
SyncIntervalSec=30s
